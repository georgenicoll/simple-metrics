name: Release

# Pushing a tag like v0.1.0 builds static binaries and publishes them, with
# checksums, as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag must match the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          name="simple-metrics-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/simple-metrics" "target/${{ matrix.target }}/release/smq" "target/${{ matrix.target }}/release/smweb" LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            simple-metrics-*.tar.gz
            simple-metrics-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only this job can write to the repository, and only once every build
    # (and its tests) has passed.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksums file
        run: cd dist && cat ./*.sha256 > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  # The same binaries again, as a multi-architecture image on GitHub's
  # container registry (ghcr.io). Built from the archives published above, not
  # recompiled, so the image holds exactly what was tested.
  image:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist-archives
          merge-multiple: true

      - name: Lay the binaries out for the Dockerfile
        run: |
          for pair in x86_64-unknown-linux-musl:amd64 aarch64-unknown-linux-musl:arm64; do
            target="${pair%%:*}"; arch="${pair##*:}"
            mkdir -p "dist/linux-$arch"
            tar -xzf "dist-archives/simple-metrics-${GITHUB_REF_NAME}-${target}.tar.gz" \
              -C "dist/linux-$arch" --strip-components=1 \
              "simple-metrics-${GITHUB_REF_NAME}-${target}/simple-metrics" \
              "simple-metrics-${GITHUB_REF_NAME}-${target}/smq" \
              "simple-metrics-${GITHUB_REF_NAME}-${target}/smweb"
          done

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/simple-metrics:${{ github.ref_name }}
          # A multi-architecture image is an index over one image per
          # architecture, and GitHub reads which repository a package belongs
          # to (and so who may push to it) from the index, not only from the
          # images' own labels.
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=A small metrics collector and its web chart
            index:org.opencontainers.image.licenses=MIT

      - name: Say what to pin
        run: |
          echo "Image: ghcr.io/${{ github.repository_owner }}/simple-metrics:${GITHUB_REF_NAME}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
