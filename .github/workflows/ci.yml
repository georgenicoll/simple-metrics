name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only ever reads the repository.
permissions:
  contents: read

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings fail the build, for the compiler as well as clippy.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked

  test:
    # The Pi is aarch64, so run the tests there natively as well as on x86_64.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --locked

  static-binary:
    # The artifact that actually gets deployed: a static musl binary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check they are statically linked and run
        run: |
          for name in simple-metrics smq smweb; do
            binary=target/${{ matrix.target }}/release/$name
            info=$(file "$binary")
            echo "$info"
            # `file` says "statically linked" on aarch64 but "static-pie linked"
            # on x86_64, which musl builds as a position-independent executable.
            echo "$info" | grep -Eq "statically linked|static-pie linked"
            "$binary" --version
          done
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/simple-metrics
            target/${{ matrix.target }}/release/smq
            target/${{ matrix.target }}/release/smweb
          if-no-files-found: error

  image:
    # The container image, built the way the release builds it (from these
    # same static binaries, for both architectures), and then run the way
    # deploy/ runs it, so a problem shows here and not at the first release.
    needs: static-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: artifacts

      - name: Lay the binaries out for the Dockerfile
        run: |
          mkdir -p dist/linux-amd64 dist/linux-arm64
          cp artifacts/bin-x86_64-unknown-linux-musl/* dist/linux-amd64/
          cp artifacts/bin-aarch64-unknown-linux-musl/* dist/linux-arm64/

      - uses: docker/setup-buildx-action@v4

      - name: Build for both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Kept as a file, not pushed, so the index can be looked at below.
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.description=A small metrics collector and its web chart
            index:org.opencontainers.image.licenses=MIT

      - name: The image index names its source repository
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          digest=$(tar -xOf image.tar index.json | jq -r '.manifests[0].digest')
          tar -xOf image.tar "blobs/sha256/${digest#sha256:}" > index-manifest.json
          jq '{mediaType, annotations, platforms: [.manifests[].platform | select(.) | "\(.os)/\(.architecture)"]}' index-manifest.json
          jq -e --arg want "https://github.com/${{ github.repository }}" \
            '.annotations["org.opencontainers.image.source"] == $want' index-manifest.json
          jq -e '[.manifests[].platform | select(.) | .architecture] | contains(["amd64","arm64"])' index-manifest.json

      - name: Build for this machine, to run
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: simple-metrics:ci

      - name: Run it as deploy/ does
        run: |
          set -euo pipefail
          for name in simple-metrics smq smweb; do
            docker run --rm "simple-metrics:ci" "/$name" --version
          done

          hardening=(--user 65532:65532 --read-only --cap-drop ALL --security-opt no-new-privileges:true)
          docker volume create sm-run
          docker volume create sm-state
          docker run -d --name collector "${hardening[@]}" --network host \
            -v /proc:/host/proc:ro -v /sys:/host/sys:ro \
            -v sm-run:/run/simple-metrics -v sm-state:/state \
            simple-metrics:ci /simple-metrics --interval 1s --retention 1h \
            --state-dir /state --root /host --interface all --ignore-interface veth
          docker run -d --name web "${hardening[@]}" -p 127.0.0.1:8080:8080 \
            -v sm-run:/run/simple-metrics \
            simple-metrics:ci /smweb --http 0.0.0.0:8080

          # Wait for a sample to show up in the chart's data.
          for _ in $(seq 1 30); do
            if curl -sf 'http://127.0.0.1:8080/data?metric=cpu_percent&range=1h' | grep -Eq '"timestamps":\[[0-9]'; then
              ok=1; break
            fi
            sleep 1
          done
          docker logs collector
          docker logs web
          [ "${ok:-0}" = 1 ] || { echo "no data reached the page" >&2; exit 1; }
          curl -sf http://127.0.0.1:8080/fragment | grep -q 'value="cpu_percent"'
          curl -sf http://127.0.0.1:8080/ | grep -q '<h1>'
          # No virtual interfaces: the filter works.
          ! curl -sf http://127.0.0.1:8080/fragment | grep -q 'veth'
